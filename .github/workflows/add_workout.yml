name: Add Garmin Workout

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Data treningu (YYYY-MM-DD)'
        required: true
      workout_name:
        description: 'Nazwa treningu'
        required: true
      workout_code:
        description: 'Kod treningu'
        required: true

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install garminconnect
      - name: Run script
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          WORKOUT_NAME: ${{ github.event.inputs.workout_name }}
          WORKOUT_CODE: ${{ github.event.inputs.workout_code }}
        run: python add_workout.py
