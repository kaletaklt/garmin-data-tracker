name: Import Treningu (Intervals.icu / Garmin)

on:
  workflow_dispatch:
    inputs:
      workout_json:
        description: 'Kod treningu w formacie JSON'
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Uruchomienie skryptu wgrywania
        env:
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          WORKOUT_PLAN: ${{ inputs.workout_json }}
        run: python add_workout.py
