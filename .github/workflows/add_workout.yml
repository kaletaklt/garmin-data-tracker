name: Dodaj Trening do Garmina (via Intervals)

on:
  workflow_dispatch:
    inputs:
      workout_date:
        description: 'Data treningu (format: YYYY-MM-DD)'
        required: true
        type: string
      workout_name:
        description: 'Nazwa treningu (np. Interwały 8x400m)'
        required: true
        type: string
      workout_description:
        description: 'Składnia treningu w formacie Intervals'
        required: true
        type: string

jobs:
  upload-workout:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v3

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalacja bibliotek
        run: |
          pip install requests

      - name: Wysyłanie treningu do Intervals
        env:
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          WORKOUT_DATE: ${{ inputs.workout_date }}
          WORKOUT_NAME: ${{ inputs.workout_name }}
          WORKOUT_DESC: ${{ inputs.workout_description }}
        run: |
          python add_workout.py --date "$WORKOUT_DATE" --name "$WORKOUT_NAME" --desc "$WORKOUT_DESC"
