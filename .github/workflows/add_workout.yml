name: Dodaj Tygodniowy Plan do Garmina

on:
  workflow_dispatch:
    inputs:
      weekly_plan:
        description: 'Wklej cały kod tygodniowy z czatu (JSON)'
        required: true
        type: string

jobs:
  upload-workouts:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v3

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalacja bibliotek
        run: |
          pip install requests

      - name: Wysyłanie treningów do Intervals
        env:
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          WEEKLY_PLAN: ${{ inputs.weekly_plan }}
        run: |
          python add_workout.py
