name: Import Treningu (Garmin)

on:
  workflow_dispatch:
    inputs:
      workout_json:
        description: 'Kod treningu'
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install requests garminconnect

      - name: Uruchomienie skryptu wgrywania
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          WORKOUT_PLAN: ${{ inputs.workout_json }}
        run: python add_workout.py
