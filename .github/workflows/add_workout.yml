name: Add Garmin Workout

on:
  workflow_dispatch:
    inputs:
      workout_code:
        description: 'Kod treningu (Linia 1: Data, Linia 2: Nazwa, Linie 3+: Trening)'
        required: true
        type: string

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install garminconnect
      - name: Run script
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          WORKOUT_CODE: ${{ github.event.inputs.workout_code }}
        run: python add_workout.py
