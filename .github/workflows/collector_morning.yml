name: Collector - 1. Poranny Raport (Wellness + Ankieta)

on:
  workflow_dispatch:
    inputs:
      energy_1_5:
        description: 'Energia rano (1-5)'
        required: false
        default: ''
      doms_info:
        description: 'Bolesność mięśniowa DOMS (np. Brak / Nogi / Góra)'
        required: false
        default: 'Brak'
      pain_info:
        description: 'Dyskomfort lub kontuzja'
        required: false
        default: 'Brak'
      user_note:
        description: 'Notatka głosowa / tekstowa'
        required: false
        default: ''
      trigger_replan:
        description: 'Tryb replanu AI Coach (auto / force / false)'
        required: false
        default: 'auto'

jobs:
  morning_collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zależności
        run: pip install garminconnect garth gspread google-auth requests

      - name: Poranny odczyt Wellness + Ankieta + Detekcja Anomalii
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
          GEMINI_LLM_API_KEY: ${{ secrets.GEMINI_LLM_API_KEY }}
          REPORT_TYPE: 'Rano_CheckIn'
          ENERGY_1_5: ${{ github.event.inputs.energy_1_5 }}
          DOMS_INFO: ${{ github.event.inputs.doms_info }}
          PAIN_INFO: ${{ github.event.inputs.pain_info }}
          USER_NOTE: ${{ github.event.inputs.user_note }}
          TRIGGER_REPLAN: ${{ github.event.inputs.trigger_replan }}
        run: python -m collector.morning
