name: Garmin Daily Synchronization Loop

on:
  workflow_dispatch:
    inputs:
      user_notes:
        description: 'Jak się dziś czujesz? (Uwagi dla AI Coacha - wpisanie nowej uwagi wymusi aktualizację jutrzejszego treningu)'
        required: false
        default: 'Samopoczucie w normie, brak dolegliwości.'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install garminconnect garth gspread google-auth requests

      - name: 1. Synchronizacja Wellness
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
        run: python wellness_collector.py

      - name: 2. Synchronizacja Aktywności
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
        run: python activity_collector.py

      - name: 3. AI Coach - Holistyczna Analiza i Planowanie
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
          GEMINI_LLM_API_KEY: ${{ secrets.GEMINI_LLM_API_KEY }}
          USER_NOTES: ${{ github.event.inputs.user_notes }}
        run: python ai_coach.py

      - name: 4. Synchronizacja Kalendarza Garmin
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
          JOIN_API_KEY: ${{ secrets.JOIN_API_KEY }}
        run: python sync_calendar.py
