name: Delete Garmin Workout

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Data treningu (YYYY-MM-DD)'
        required: true
      workout_name:
        description: 'Nazwa treningu do usunięcia'
        required: true

jobs:
  delete:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install garminconnect garth gspread requests

      - name: Uruchomienie skryptu usuwającego
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          WORKOUT_NAME: ${{ github.event.inputs.workout_name }}
        run: python delete_workout.py
