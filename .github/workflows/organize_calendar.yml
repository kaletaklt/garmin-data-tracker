name: Google Calendar Auto-Organizer

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7,13,19 * * *'

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja zależności
        run: pip install google-auth requests

      - name: Segregacja i kolorowanie wydarzeń
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
          GEMINI_LLM_API_KEY: ${{ secrets.GEMINI_LLM_API_KEY }}
        run: python calendar_organizer.py
